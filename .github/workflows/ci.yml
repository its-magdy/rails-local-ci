name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.2", "3.3"]
        rails-version: ["rails-6.1", "rails-7.0", "rails-7.1", "rails-7.2"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
          bundler: latest

      - name: Install dependencies
        run: bundle exec appraisal install

      - name: Run tests
        run: bundle exec appraisal ${{ matrix.rails-version }} ruby test/continuous_integration_test.rb
