name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.2", "3.3"]
        rails-version: ["rails-7.1", "rails-7.2"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
          bundler: latest

      - name: Install dependencies
        run: bundle exec appraisal install

      - name: Run tests
        run: bundle exec appraisal ${{ matrix.rails-version }} ruby test/continuous_integration_test.rb

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.3"

      - name: Install bundler-audit
        run: gem install bundler-audit

      - name: Audit Gemfile.lock for vulnerable gems
        run: bundle-audit check --update
